apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kubeknit
spec:
  version: "{{ .TagName }}"
  platforms:
    - {{addURIAndSha "https://github.com/KubeHat/kubeknit/releases/download/{{ .TagName }}/bundle.tar.gz" .TagName | indent 6 }}
      bin: kubeknit-krew
      files:
        - from: ./kubeknit-krew
          to: .
        - from: LICENSE
          to: .
      selector:
        matchExpressions:
          - key: os
            operator: In
            values: ["darwin", "linux"]
  shortDescription: Import, delete, merge and export kubeconfig files
  homepage: https://github.com/KubeHat/kubeknit
  description: |+2

      Import clusters into your kubeconfig, delete contexts together with their
      unused clusters and users, merge kubeconfig files, or export a minimal
      kubeconfig for some contexts.

      import and delete only change your kubeconfig with --save, otherwise they
      show what would change.

      Usage:
        $ kubectl kubeknit import --save new-cluster.yaml
        $ kubectl kubeknit delete --save old-context
        $ kubectl kubeknit merge config1 config2 > merged.yaml
        $ kubectl kubeknit export dev prod > dev-prod.yaml

      More on https://github.com/KubeHat/kubeknit#usage
