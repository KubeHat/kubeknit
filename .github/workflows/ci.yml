name: kubeknit CI
on:
  push:
    branches:
    - '*'
    tags:
    - 'v*.*.*'
  pull_request:
    branches:
    - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:

    - name: Check out repo
      uses: actions/checkout@v7

    - name: Shellcheck
      uses: ludeeus/action-shellcheck@2.0.0
      env:
        SHELLCHECK_OPTS: -e SC2155

    - name: Run tests
      run: |
         set -euo pipefail
         sudo apt-get update -qq
         sudo apt-get install -qq bats
         # Install the latest stable kubectl
         KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
         sudo curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
         sudo chmod +x /usr/local/bin/kubectl
         kubectl version --client
         make test

    - name: Create assets
      if: startsWith(github.ref, 'refs/tags/')
      run: make deploy

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        # published by hand after testing
        draft: true
        body_path: doc/releases/${{ github.ref_name }}.md
        files: |
          out/bundle.tar.gz*
          kubeknit

