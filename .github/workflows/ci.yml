name: kubeknit CI
on:
  push:
    branches:
    - '*'
    tags:
    - 'v*.*.*'
  pull_request:
    branches:
    - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Check out repo
      uses: actions/checkout@v4

    - name: Shellcheck
      uses: ludeeus/action-shellcheck@2.0.0
      env:
        SHELLCHECK_OPTS: -e SC2155

    - name: Run tests
      run: |
         set -euo pipefail
         sudo apt-get update -qq
         sudo apt-get install -qq bats
         # Install the latest stable kubectl
         KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
         sudo curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
         sudo chmod +x /usr/local/bin/kubectl
         kubectl version --client
         make test

    - name: Create assets
      if: startsWith(github.ref, 'refs/tags/')
      run: make deploy

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          out/bundle.tar.gz*
          kubeknit

    # Only works once kubeknit is listed in krew-index. The first submission is
    # a manual PR; afterwards set the repository variable KREW_INDEX_LISTED=true.
    - name: Create PR in krew-index
      if: startsWith(github.ref, 'refs/tags/') && vars.KREW_INDEX_LISTED == 'true'
      uses: rajatjindal/krew-release-bot@v0.0.40
      with:
        krew_template_file: .kubeknit.yaml
